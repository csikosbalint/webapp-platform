name: Publish core

# Tag-driven so a publish is always traceable to a commit:
#   git tag core-v1.0.1 && git push origin core-v1.0.1
on:
  push:
    tags:
      - "webapp-platform-core-v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required for GITHUB_TOKEN to push to GitHub Packages.
      packages: write

    defaults:
      run:
        working-directory: core

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: core/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - run: pnpm run test

      # Fails the job if the tag does not match the version in package.json,
      # which is the usual way a tagged publish goes wrong.
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag_version="${GITHUB_REF_NAME#core-v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag $GITHUB_REF_NAME implies $tag_version but package.json says $pkg_version" >&2
            exit 1
          fi

      # prepublishOnly re-runs clean/build/test; --no-git-checks because the
      # runner's checkout is detached at the tag.
      - run: pnpm publish --no-git-checks
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
